name: Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Prepare project
        run: |
          chmod +x android/gradlew
          flutter pub get
      - name: Check source and UI
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build universal release APK
        run: flutter build apk --release --no-pub --target-platform android-arm,android-arm64,android-x64
      - name: Collect universal APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/View-Q-universal.apk
      - name: Build smaller APKs for each processor
        run: |
          flutter build apk --release --no-pub --split-per-abi --target-platform android-arm,android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/View-Q-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/View-Q-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/View-Q-x86_64.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: View-Q-Android-APKs
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
