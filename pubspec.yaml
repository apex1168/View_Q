name: view_q
description: A private, offline screenshot library with on-device text search.
publish_to: none
version: 1.1.2+4
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  material_ui: 1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/tessdata/eng.traineddata
    - licenses/
    - assets/branding/logo.png
  fonts:
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
